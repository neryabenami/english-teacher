# Writes the day's articles and words early in the morning (Israel 04:30 and 06:30 in summer, an hour earlier in winter;
# the second run only retries what failed), and fills missing meanings / examples later in the day.
# Also runs on demand from the app when the level changes.
# then publishes the app to GitHub Pages (free for public repos).
# Code changes are published separately and at once by pages.yml, so they never wait for this long job.
name: Update articles and deploy

on:
  schedule:
    - cron: '30 1 * * *'   # the day's new words and articles
    - cron: '30 3 * * *'   # retry what failed (quotas are per day, nothing is added twice)
    - cron: '0 11 * * *'   # fill gaps only
    - cron: '0 17 * * *'   # fill gaps only
  workflow_dispatch:
    inputs:
      check_sources:
        description: Only check which news sources can be read (writes nothing)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  content:
    runs-on: ubuntu-latest
    concurrency:
      group: content
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check news sources
        if: inputs.check_sources
        run: SOURCES_CHECK=1 node tools/news-pipeline.mjs

      - name: Write today's learning articles from real news
        if: ${{ !inputs.check_sources && github.event.schedule != '0 11 * * *' && github.event.schedule != '0 17 * * *' }}
        run: node tools/news-pipeline.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READING_LEVEL: ${{ vars.READING_LEVEL }}

      - name: Add today's new words
        if: ${{ !inputs.check_sources }}
        run: node tools/add-daily-words.mjs
        env:
          FILL_ONLY: ${{ (github.event.schedule == '0 11 * * *' || github.event.schedule == '0 17 * * *') && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READING_LEVEL: ${{ vars.READING_LEVEL }}

      - name: Publish the articles the reader deleted (their audio is removed by the audio run)
        if: ${{ !inputs.check_sources }}
        run: node -e "require('fs').writeFileSync('data/hidden.json', JSON.stringify((process.env.HIDDEN || '').split(',').filter(Boolean)))"
        env:
          HIDDEN: ${{ vars.HIDDEN_ARTICLES }}

      - name: Save articles and words to the repository
        if: ${{ !inputs.check_sources }}
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update articles and words"
            # code may have been pushed while this run was writing: replay the data commit on top of it
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi

  publish:
    needs: content
    if: ${{ !inputs.check_sources }}
    runs-on: ubuntu-latest
    # shared with pages.yml: one publish at a time; each one publishes the newest commit
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
