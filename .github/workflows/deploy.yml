# Refreshes the real articles every 6 hours and publishes the app to GitHub Pages (free for public repos).
name: Update articles and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      check_sources:
        description: Only check which news sources can be read (writes nothing)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check news sources
        if: inputs.check_sources
        run: SOURCES_CHECK=1 node tools/news-pipeline.mjs

      - name: Write today's learning articles from real news
        if: github.event_name != 'push' && !inputs.check_sources
        run: node tools/news-pipeline.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READING_LEVEL: ${{ vars.READING_LEVEL }}

      - name: Add today's new words
        if: github.event_name != 'push' && !inputs.check_sources
        run: node tools/add-daily-words.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READING_LEVEL: ${{ vars.READING_LEVEL }}

      - name: Save articles and words to the repository
        if: github.event_name != 'push' && !inputs.check_sources
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update articles and words"
            # code may have been pushed while this run was writing: replay the data commit on top of it
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi

      # a run that waited in the queue must not publish an older copy: always deploy the newest commit (code + words + articles)
      - name: Use the newest version of the repository
        run: git pull --ff-only origin main || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
